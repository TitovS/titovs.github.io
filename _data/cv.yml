# This file affects only /cv/ and its printed PDF. Customize it on each CV branch.
# Entry IDs are filenames without .md (experience/publications), or data keys.
# Use "all" for newest-first order, [] to omit entries, or a list for exact order.
sections:
  - summary
  - experience
  - education
  - skills
  - publications
  - teaching
  - awards

summary: >-
  As a team lead, I believe in listening; as a researcher, in failure;
  and as an engineer, in infrastructure. Give talented people the
  infrastructure and time they need, and they can change the world.

# Name, location, email, website, GitHub, and LinkedIn default to _config.yml.
# Optional CV-only overrides, for example: profile: {location: "Amsterdam"}
profile: {}

# Use "full" for the Markdown body of each role, or "summary" for a shorter CV.
experience_detail: full

# Explicit order follows the current role files; use "all" for automatic ordering.
experience:
  - jetbrains-team-lead
  - jetbrains-researcher
  - dxfeed-data-scientist
  - institute-of-philosophy-junior-researcher
education:
  - masters
  - bachelors
teaching:
  - neapolis-statistics
  - constructor-statistics
awards: all

# Edit or remove skill categories here.
skills:
  LLM fine-tuning: "SFT, RL (NeMo RL, verl, Transformers, PyTorch)"
  Evaluation: "Inspect AI, Harbor"
  Infrastructure: "Docker, Kubernetes"

# Selected for venue, relevance, and the distinguished-paper award.
publications:
  - 2026-12-06-libevobench-full
  - 2026-12-06-benchmark-generalizability-full
  - 2026-11-01-jupyter-notebook-logs
  - 2026-07-05-in-ide-calibration
