<article class="cv-entry" data-cv-id="{{ include.id | escape }}">
  <div class="cv-entry-heading">
    <h3>{{ include.entry.course | escape }}</h3>
    <p class="cv-date">{{ include.entry.period | escape }}</p>
  </div>
  <p class="cv-meta">{{ include.entry.role | escape }} · {% if include.entry.url %}<a href="{{ include.entry.url | escape }}">{{ include.entry.institution | escape }}</a>{% else %}{{ include.entry.institution | escape }}{% endif %}</p>
</article>
