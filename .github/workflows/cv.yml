name: Build CV preview

on:
  push:
    paths:
      - "cv/**"
      - "_data/**"
      - "_config.yml"
      - "_work_experience/**"
      - "_publications/**"
      - "_pages/cv.html"
      - "_layouts/cv.html"
      - "_includes/cv/**"
      - "_includes/work-experience-date.html"
      - "Gemfile"
      - "Gemfile.lock"
      - ".github/workflows/cv.yml"
  pull_request:
    paths:
      - "cv/**"
      - "_data/**"
      - "_config.yml"
      - "_work_experience/**"
      - "_publications/**"
      - "_pages/cv.html"
      - "_layouts/cv.html"
      - "_includes/cv/**"
      - "_includes/work-experience-date.html"
      - "Gemfile"
      - "Gemfile.lock"
      - ".github/workflows/cv.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Validate CV selections
        run: bundle exec ruby cv/check.rb
      - name: Build website and standalone CV
        run: bundle exec jekyll build
      - name: Check rendered CV
        run: bundle exec ruby cv/check.rb _site/cv/index.html
      - name: Check branch customization
        run: bundle exec ruby cv/tests/render.rb
      - uses: actions/upload-artifact@v4
        with:
          name: cv-${{ github.sha }}
          path: _site/cv/index.html
          if-no-files-found: error
          retention-days: 14
