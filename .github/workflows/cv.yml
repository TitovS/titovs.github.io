name: Build CV

on:
  push:
    paths:
      - "main.tex"
      - "cv/**"
      - "_data/**"
      - "_config.yml"
      - "_work_experience/**"
      - "_publications/**"
      - ".github/workflows/cv.yml"
  pull_request:
    paths:
      - "main.tex"
      - "cv/**"
      - "_data/**"
      - "_config.yml"
      - "_work_experience/**"
      - "_publications/**"
      - ".github/workflows/cv.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaLaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-luatex texlive-latex-extra texlive-fonts-recommended
      - name: Check shared content and branch customization
        run: texlua cv/tests/check.lua
      - name: Compile PDF directly from YAML
        run: latexmk -g -lualatex -halt-on-error -interaction=nonstopmode -file-line-error -outdir=cv/build main.tex
      - uses: actions/upload-artifact@v4
        with:
          name: cv-${{ github.sha }}
          path: cv/build/main.pdf
          if-no-files-found: error
          retention-days: 14
